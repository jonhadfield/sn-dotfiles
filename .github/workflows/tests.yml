name: Test sn-dotfiles

on:
  push:
    branches: [ master, main, test-goreleaser ]
  pull_request:
    branches: [ master, main ]
jobs:
  test:
    # The tests share one Standard Notes account, so two runs at once would
    # fight over the same notes: the group is deliberately global rather than
    # per-branch. Queue behind a running job rather than cancelling it, or a
    # merge to main kills whatever a pull request is in the middle of, and
    # a cancelled run leaves its test data behind for the next one to trip on.
    concurrency:
      group: test
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      -
        name: Tests
        run: |
          go mod tidy
          go test -cover -v -failfast -p 1 $(go list ./...)
        env:
          # The live-server tests are opt-in so that `go test ./...` works on a
          # machine with no credentials; CI opts in, and has the account.
          SN_INTEGRATION_TESTS: true
          SN_EMAIL: ${{ secrets.SN_EMAIL }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}