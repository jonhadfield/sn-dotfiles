name: Test sn-dotfiles

on:
  push:
    branches: [ master, main, test-goreleaser ]
  pull_request:
    branches: [ master, main ]
jobs:
  test:
    # These run against the in-memory server, so there is no shared account to
    # serialise against: key the group by branch and platform, and let the
    # matrix run in parallel. The live suite is in live-tests.yml.
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      -
        name: Tests
        run: |
          go mod tidy
          go test -cover -v -failfast -p 1 $(go list ./...)
        # No credentials: the tests run against the in-memory Standard Notes
        # server. Running the whole suite against the real account on every
        # push exhausted its rate limit, and the mock exercises the same code
        # paths. live-tests.yml still runs against the account, on a schedule.