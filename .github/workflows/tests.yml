name: Test sn-dotfiles

on:
  push:
    branches: [ master, main, test-goreleaser ]
  pull_request:
    branches: [ master, main ]
jobs:
  test:
    concurrency:
      group: test
      cancel-in-progress: true
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        # The suite runs against a real account when SN_EMAIL and SN_PASSWORD
        # are set, and against the in-memory mock server in internal/snmock
        # otherwise, so it also passes on forks with no secrets configured.
        name: Tests
        run: |
          go mod tidy
          go test -cover -v -failfast -p 1 $(go list ./...)
        env:
          SN_SERVER: ${{ secrets.SN_SERVER }}
          SN_EMAIL: ${{ secrets.SN_EMAIL }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}