# GoReleaser configuration - v2 syntax
# Documentation: https://goreleaser.com

version: 2

project_name: sn-dotfiles

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go mod tidy
    - go mod download

# Universal macOS binary, so the cask serves both architectures from one archive
universal_binaries:
  - id: sn-dotfiles-macos-universal
    ids:
      - sn-dotfiles-macos-amd64
      - sn-dotfiles-macos-arm64
    name_template: "sn-dotfiles"
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: sn-dotfiles-macos-amd64
    main: ./cmd/sn-dotfiles/
    binary: sn-dotfiles
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.sha={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
      - -X main.tag={{ .Tag }}
    env:
      - CGO_ENABLED=0

  - id: sn-dotfiles-macos-arm64
    main: ./cmd/sn-dotfiles/
    binary: sn-dotfiles
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.sha={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
      - -X main.tag={{ .Tag }}
    env:
      - CGO_ENABLED=0

  - id: sn-dotfiles
    main: ./cmd/sn-dotfiles/
    binary: sn-dotfiles
    goos:
      - linux
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.sha={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
      - -X main.tag={{ .Tag }}
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - sn-dotfiles
    files:
      - LICENSE
      - README.md

  - id: macos
    name_template: "{{ .ProjectName }}_Darwin_universal"
    ids:
      - sn-dotfiles-macos-universal
    files:
      - LICENSE
      - README.md

homebrew_casks:
  - name: sn-dotfiles
    binaries: [sn-dotfiles]
    repository:
      owner: jonhadfield
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jonhadfield/sn-dotfiles
    description: Manage your dotfiles with Standard Notes
    # The darwin binaries are not signed, and casks set the quarantine flag on
    # download, so Gatekeeper blocks the first run. Clear it here.
    #
    # goreleaser's hooks.post.install emits a `postflight` block, which
    # Homebrew 7 deprecates in favour of `postflight_steps`, warning on every
    # install and update. That is not a rename: postflight_steps takes
    # declarative steps rather than arbitrary Ruby, so the body is rewritten
    # and injected through custom_block instead. Revert to hooks once
    # goreleaser emits postflight_steps itself.
    custom_block: |
      # staged_path is a Homebrew template token, not the Ruby method the
      # postflight block used, and goreleaser renders this through Go's
      # templating first, so the braces are escaped to survive it.
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/sn-dotfiles"], must_succeed: false
      end

release:
  github:
    owner: jonhadfield
    name: sn-dotfiles

  prerelease: auto
  name_template: '{{ .Tag }}'

announce:
  skip: true

snapshot:
  version_template: "{{ .Tag }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - README
      - test
      - ignore

checksum:
  name_template: 'checksums.txt'
